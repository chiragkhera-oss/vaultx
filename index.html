      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;

    .logo {
      font-size: 3rem;

      text-transform: uppercase;
      margin-bottom: 3rem;
    }
    .headline {
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
      max-width: 520px;

      font-size: 1rem;
      color: #888;
      text-align: center;

      font-size: 1rem;

      text-decoration: none;
      letter-spacing: 1px;
      transition: opacity 0.15s;

    .btn-yt  { background: #ff0000; color: #fff; }
    .btn-ig  { background: linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); color: #fff; }
    .btn-tt  { background: #010101; color: #fff; border: 1px solid #333; }
    .footer {
      margin-top: 4rem;
      font-size: 0.75rem;
      color: #444;
      text-align: center;
      line-height: 2;
    }
    .footer a {
      color: #888;
      text-decoration: underline;
      margin: 0 0.5rem;
    }
    .footer a:hover { color: #c9a84c; }
    .divider {
      width: 40px;
      height: 2px;
      background: #c9a84c;
      margin: 0 auto 3rem;
    }
